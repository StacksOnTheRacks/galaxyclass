name: CI

on:
  push:
    branches: [main]
  # Any base, so stacked PRs get checks before they retarget to main.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test accounts
        run: npm run test --workspace=@galaxyclass/accounts

      - name: Test studio site
        run: npm run test --workspace=@galaxyclass/www

      - name: Test Riffle
        run: npm run test --workspace=@galaxyclass/riffle

      - name: Test Scribble
        run: npm run test --workspace=@galaxyclass/scribble

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/scribble

      - name: Scribble two-browser e2e
        run: npm run test:e2e --workspace=@galaxyclass/scribble

      - name: Test infrastructure
        run: npm run test --workspace=@galaxyclass/infra
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          CDK_DEFAULT_REGION: us-east-1
